name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:

  # B1 · Validación de sintaxis e integridad
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Validar formato del codigo
        run: terraform fmt -check

      - name: Inicializar Terraform con backend remoto
        run: terraform init -backend-config=backend.hcl

      - name: Validar sintaxis de Terraform
        run: terraform validate

  # B2 · Análisis de políticas (IaC)
  politicas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Escaneo de políticas de IaC con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # B3 · Plan y compuerta sobre el plan
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform
        run: terraform init -backend-config=backend.hcl

      - name: Generar y guardar el plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json

      # Regla 2 · Publicar el plan en el Pull Request (Informativo)
      - name: Formatear plan para lectura
        if: github.event_name == 'pull_request'
        run: |
          terraform show -no-color tfplan > tfplan.txt

      - name: Comentar el plan en el Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planText = fs.readFileSync('infra/tfplan.txt', 'utf8');
            const output = `#### Plan de Terraform 📖
            \`\`\`hcl
            ${planText}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Regla 1 · Compuerta: Fallar si detecta acciones de destrucción (delete)
      - name: Validar que no existan destrucciones
        run: |
          DELETES=$(jq '[.resource_changes[]?.change.actions[] | select(. == "delete")] | length' tfplan.json)
          if [ "$DELETES" -gt "0" ]; then
            echo "::error::El plan incluye $DELETES acciones de destruccion no autorizadas."
            exit 1
          fi

      - name: Subir el plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          if-no-files-found: error

  # B4 · Aplicación
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform
        run: terraform init -backend-config=backend.hcl

      - name: Descargar artefacto tfplan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Aplicar el plan sin recalcular
        run: terraform apply -input=false tfplan
